name: CI & Anti-Regression Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    name: Code Quality & Safety Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting (cargo fmt)
        run: cargo fmt --check

      - name: Strict Clippy Lints
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Prohibit unwrap() in production code
        run: cargo clippy --lib --bins -- -D clippy::unwrap_used -D clippy::expect_used

      - name: Scan for raw .unwrap() in src/
        run: |
          if grep -rn --include="*.rs" "\.unwrap()" src/ | grep -v "mod tests" | grep -v "cfg(test)" ; then
            echo "::error file=src/::Se han detectado llamadas a .unwrap() en producción en src/."
            exit 1
          else
            echo "No se encontraron llamadas directas a .unwrap() en producción."
          fi

      - name: Run cargo test
        run: cargo test --all-targets --all-features
